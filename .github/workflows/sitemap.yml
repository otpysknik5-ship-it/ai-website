name: Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate sitemap

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url: https://aimihome.ru/
          exclude: |
            **/assets/**
            **/images/**
            **/css/**
          include: |
            **/*.html
            **/*.htm
          exclude-paths: |
            /404.html
            /index.html
          verbose: true

      - name: Commit and push sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Автоматическое обновление sitemap.xml" || echo "No changes to commit"
          git push
